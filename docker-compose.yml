version: '3.8'

services:
  dextools-qubic-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - QUBIC_RPC_URL=https://rpc.qubic.org/v1
      - QUBIC_RPC_TIMEOUT=10000
      - CORS_ORIGIN=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dextools-network

networks:
  dextools-network:
    driver: bridge
